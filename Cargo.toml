[package]
name = "solaris-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Independent native Minecraft Java client for Solaris"
publish = false

[[bin]]
name = "solaris-client"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.102"
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = { version = "=1.0.149", features = ["arbitrary_precision"] }
wgpu = "=27.0.1"
winit = "=0.30.12"
pollster = "=0.4.0"
bytemuck = { version = "=1.25.0", features = ["derive"] }
glam = "=0.30.10"
libm = "=0.2.16"
png = "=0.18.1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
flate2 = "=1.1.9"
uuid = { version = "=1.21.0", features = ["v4", "serde"] }
sha2 = { version = "=0.10.9", features = ["oid"] }
sha1 = "=0.10.6"
getrandom = "=0.3.4"
md5 = "=0.7.0"
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "vorbis"] }
symphonia = { version = "=0.5.5", default-features = false, features = ["ogg", "vorbis"] }
parking_lot = "=0.12.5"
cpal = "=0.16.0"
unsafe-libopus = "=0.2.0"
base64 = "=0.22.1"
unicode-bidi = "=0.3.18"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
crc32c = "=0.6.8"
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
arabic_reshaper = "=0.4.2"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls"] }
rsa = { version = "=0.9.10", default-features = false, features = ["std", "u64_digit", "sha1"] }
freetype-rs = { version = "=0.38.0", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
# Nested Wayland compositor that hosts apps launched into a monitor (src/computer/nested.rs).
smithay = { version = "=0.7.0", default-features = false, features = ["wayland_frontend", "desktop"] }

# Windows desktop capture for the in-world computer (src/computer/windows.rs).
# Pinned to the `windows` 0.58.0 already locked for wgpu-hal; all features are
# in-crate, so no extra system libraries are needed on MSVC or GNU targets.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
debug = 1
incremental = false

# The pure-Rust Opus codec is far too slow unoptimized for 20 ms real-time frames.
[profile.dev.package.unsafe-libopus]
opt-level = 3

[workspace]
members = [".", "launcher"]
default-members = [".", "launcher"]

[profile.release]
# Shipping binaries: small and fast to start; the client crate is already heavy.
codegen-units = 16

[patch.crates-io]
# Vendored winit 0.30.12 with one X11 fix: wheel buttons 4..=7 ignore Released
# (see vendor/winit/SOLARIS_PATCH.md). Upstream 0.30.13 still has the bug.
winit = { path = "vendor/winit" }
