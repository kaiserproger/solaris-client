name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Singleplayer ships the Solaris server and the default plugin pack. Both are
  # pinned to FULL commit SHAs (never tags), like the server's own CI pins its
  # siblings; bump deliberately. The server must contain the SDK/WIT and the
  # `local_addr` listening-line change the singleplayer port discovery relies on.
  # Push both pinned commits before CI runs; re-bump the core SHA if
  # pauline/release moves before the release tag is created.
  SOLARIS_REVISION: 97c92e301c1529937163d7ff4f794a37f78b5615
  SOLARIS_PLUGINS_REVISION: 63540715138d5e74d5a00a595992d5ebe9056371

permissions:
  contents: read

jobs:
  check:
    name: cargo check
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Pinned to the channel in rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libvulkan-dev cmake
      - run: cargo check --workspace --locked
      # naga parse/validate/translate of every runtime WGSL shader (no GPU needed).
      - run: cargo test --locked -p solaris-client --lib wgsl_validation

  release:
    name: Release (${{ matrix.name }})
    # Tags publish a prerelease; manual dispatch only builds (no uploads).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            exe_suffix: ""
            archive: tar.gz
          - name: windows-x86_64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            exe_suffix: .exe
            archive: zip
          - name: macos-aarch64
            runner: macos-14
            rust_target: aarch64-apple-darwin
            exe_suffix: ""
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: launcher-release-${{ matrix.name }}
      - name: Install GUI dependencies
        if: matrix.name == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libvulkan-dev cmake mold
      # freetype-sys 0.23 "bundled" compiles libpng against a zlib include dir its
      # crate does not ship; point MSVC at the vendored zlib in libz-sys instead.
      - name: Expose zlib headers to bundled freetype
        if: matrix.name == 'windows-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked
          zlib="$(ls -d "${CARGO_HOME:-$HOME/.cargo}"/registry/src/*/libz-sys-*/src/zlib | head -n 1)"
          test -f "$zlib/zlib.h"
          echo "CFLAGS_x86_64_pc_windows_msvc=/I$(cygpath -w "$zlib")" >> "$GITHUB_ENV"
      - name: Build release binaries
        run: cargo build --release --locked
      - name: Check out Solaris server (pinned)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/solaris
          ref: ${{ env.SOLARIS_REVISION }}
          path: solaris-server
      - name: Check out default plugins (pinned)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/solaris-default-plugins
          ref: ${{ env.SOLARIS_PLUGINS_REVISION }}
          path: solaris-default-plugins
      # The server pins its own toolchain; its rust-toolchain.toml selects it.
      - uses: dtolnay/rust-toolchain@1.94
        with:
          targets: ${{ matrix.rust_target }}
      - name: Build Solaris server
        working-directory: solaris-server
        run: cargo build --release --locked -p mc-edge --bin solaris-v2
      - name: Stage Linux package
        if: matrix.name == 'linux-x86_64'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dir="solaris-client-${TAG}-linux-x86_64"
          rm -rf stage && mkdir -p "stage/$dir"
          install -m 0755 target/release/solaris-client "stage/$dir/solaris-client"
          install -m 0755 target/release/solaris-launcher "stage/$dir/solaris-launcher"
          install -m 0644 launcher/assets/icon.png "stage/$dir/solaris-launcher.png"
          install -m 0644 packaging/solaris-launcher.desktop "stage/$dir/solaris-launcher.desktop"
          install -m 0755 packaging/install-desktop.sh "stage/$dir/install-desktop.sh"
          install -m 0644 README.md LICENSE-MIT LICENSE-APACHE "stage/$dir/"
          packaging/stage-singleplayer.sh "stage/$dir"
      - name: Stage Windows package
        if: matrix.name == 'windows-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf stage && mkdir stage
          install -m 0755 target/release/solaris-client.exe stage/solaris-client.exe
          install -m 0755 target/release/solaris-launcher.exe stage/solaris-launcher.exe
          install -m 0644 launcher/assets/icon.png stage/icon.png
          install -m 0644 README.md LICENSE-MIT LICENSE-APACHE stage/
          packaging/stage-singleplayer.sh stage .exe
      - name: Stage macOS app
        if: matrix.name == 'macos-aarch64'
        run: |
          set -euo pipefail
          app="stage/Solaris.app"
          macos="$app/Contents/MacOS"
          resources="$app/Contents/Resources"
          mkdir -p "$macos" "$resources/Solaris.iconset"
          install -m 0755 target/release/solaris-launcher "$macos/solaris-launcher"
          install -m 0755 target/release/solaris-client "$macos/solaris-client"
          packaging/stage-singleplayer.sh "$macos"
          install -m 0644 packaging/Info.plist "$app/Contents/Info.plist"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" launcher/assets/icon.png --out "$resources/Solaris.iconset/icon_${size}x${size}.png"
            doubled=$((size * 2))
            sips -z "$doubled" "$doubled" launcher/assets/icon.png --out "$resources/Solaris.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$resources/Solaris.iconset" -o "$resources/Solaris.icns"
          rm -rf "$resources/Solaris.iconset"
          codesign --force --deep -s - "$app"
      - name: Assert no Mojang bytes in staging
        shell: bash
        run: |
          set -euo pipefail
          if find stage -iname '*.jar' | grep -q .; then
            echo "staging dir contains *.jar" >&2
            exit 1
          fi
          if find stage -type d -name assets | grep -q .; then
            echo "staging dir contains an assets/ directory" >&2
            exit 1
          fi
      - name: Package Linux tarball
        if: matrix.name == 'linux-x86_64'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tar -C stage -czf "solaris-client-${TAG}-linux-x86_64.tar.gz" \
            "solaris-client-${TAG}-linux-x86_64"
      # The packaged binary must start without the build checkout: extract it
      # outside the workspace and make the workspace unwritable while it runs.
      - name: Smoke packaged Linux client
        if: matrix.name == 'linux-x86_64'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP" -xzf "solaris-client-${TAG}-linux-x86_64.tar.gz"
          chmod a-w "$GITHUB_WORKSPACE"
          trap 'chmod u+w "$GITHUB_WORKSPACE"' EXIT
          packaging/smoke-release.sh "$RUNNER_TEMP/solaris-client-${TAG}-linux-x86_64/solaris-client"
      - name: Package Windows zip
        if: matrix.name == 'windows-x86_64'
        env:
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: Compress-Archive -Path stage/* -DestinationPath "solaris-client-${env:TAG}-windows-x86_64.zip"
      - name: Package macOS app
        if: matrix.name == 'macos-aarch64'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent stage/Solaris.app "solaris-client-${TAG}-macos-aarch64.zip"
      # Uploaded straight to the release: no Actions artifact storage involved.
      - name: Checksum
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          shopt -s nullglob
          for f in solaris-client-*.tar.gz solaris-client-*.zip; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          # Hyphenated tags (v1.0.0-rc.1) stay prereleases; final tags become `latest`.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            solaris-client-*.tar.gz
            solaris-client-*.zip
            solaris-client-*.sha256
